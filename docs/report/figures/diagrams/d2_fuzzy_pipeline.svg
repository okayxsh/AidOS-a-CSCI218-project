<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="872" viewBox="0 0 1600 872" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
<defs><marker id="ah-teal" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087F84"/></marker><marker id="ah-teal-s" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#087F84"/></marker><marker id="ah-navy" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13283B"/></marker><marker id="ah-navy-s" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#13283B"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="ah-amber-s" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B7791F"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7A"/></marker><marker id="ah-muted-s" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5B6B7A"/></marker></defs>
<rect x="0" y="0" width="1600" height="872" fill="#FFFFFF"/>
<rect x="20" y="20" width="480" height="212" rx="6" ry="6" fill="#FFFFFF" stroke="#087F84" stroke-width="2"/>
<text x="40" y="66" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#087F84" font-weight="700" text-anchor="start" style="white-space:pre">1  Crisp ratings</text>
<text x="40" y="105" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">severity, time criticality,</text>
<text x="40" y="139" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">vulnerability: each 0–10</text>
<text x="40" y="173" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5B6B7A" font-weight="400" text-anchor="start" style="white-space:pre">checked: finite and in range</text>
<rect x="560" y="20" width="480" height="212" rx="6" ry="6" fill="#FFFFFF" stroke="#13283B" stroke-width="1.5"/>
<text x="580" y="66" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#13283B" font-weight="700" text-anchor="start" style="white-space:pre">2  Fuzzify</text>
<text x="580" y="105" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">low (0, 0, 2, 5)  trapezoid</text>
<text x="580" y="139" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">medium (2, 5, 8)  triangle</text>
<text x="580" y="173" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">high (5, 8, 10, 10)  trapezoid</text>
<text x="580" y="207" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5B6B7A" font-weight="400" text-anchor="start" style="white-space:pre">degrees sum to 1 (Ruspini)</text>
<rect x="1100" y="20" width="480" height="212" rx="6" ry="6" fill="#FFFFFF" stroke="#13283B" stroke-width="1.5"/>
<text x="1120" y="66" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#13283B" font-weight="700" text-anchor="start" style="white-space:pre">3  Fire 27 rules</text>
<text x="1120" y="105" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">complete 3 × 3 × 3 rule base</text>
<text x="1120" y="139" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">strength α = μ(s) · μ(t) · μ(v)</text>
<text x="1120" y="173" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">(product t-norm)</text>
<rect x="20" y="302" width="480" height="212" rx="6" ry="6" fill="#FFFFFF" stroke="#13283B" stroke-width="1.5"/>
<text x="40" y="348" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#13283B" font-weight="700" text-anchor="start" style="white-space:pre">4  Sugeno average</text>
<text x="40" y="387" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">score = Σ α·c / Σ α</text>
<text x="40" y="421" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">constant outputs c: low 12.5,</text>
<text x="40" y="455" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">moderate 37.5, high 62.5,</text>
<text x="40" y="489" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">critical 87.5</text>
<rect x="560" y="302" width="480" height="212" rx="6" ry="6" fill="#FFFFFF" stroke="#087F84" stroke-width="2"/>
<text x="580" y="348" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#087F84" font-weight="700" text-anchor="start" style="white-space:pre">5  Urgency score</text>
<text x="580" y="387" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">0–100, rounded to 4 decimals</text>
<text x="580" y="421" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">low [0, 25), moderate [25, 50),</text>
<text x="580" y="455" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">high [50, 75), critical [75, 100]</text>
<rect x="1100" y="302" width="480" height="212" rx="6" ry="6" fill="#FFFFFF" stroke="#13283B" stroke-width="1.5"/>
<text x="1120" y="348" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#13283B" font-weight="700" text-anchor="start" style="white-space:pre">6  Explanation</text>
<text x="1120" y="387" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">memberships and fired rules</text>
<text x="1120" y="421" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">contribution = (α / Σ α) · c</text>
<text x="1120" y="455" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">contributions sum to the score</text>
<text x="1120" y="489" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5B6B7A" font-weight="400" text-anchor="start" style="white-space:pre">(before rounding)</text>
