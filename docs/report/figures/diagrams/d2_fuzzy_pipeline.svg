<text x="48" y="638" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5B6B7A" font-weight="700" text-anchor="start" style="white-space:pre">rule</text>
<text x="150" y="638" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5B6B7A" font-weight="700" text-anchor="start" style="white-space:pre">antecedent (s, t, v) → term</text>
<text x="750" y="638" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5B6B7A" font-weight="700" text-anchor="end" style="white-space:pre">α</text>
<text x="880" y="638" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5B6B7A" font-weight="700" text-anchor="end" style="white-space:pre">c</text>
<text x="1100" y="638" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5B6B7A" font-weight="700" text-anchor="end" style="white-space:pre">contribution</text>
<text x="48" y="676" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">R26</text>
<text x="150" y="676" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">high, high, medium → critical</text>
<text x="750" y="676" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">4/9</text>
<text x="880" y="676" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">87.5</text>
<text x="1100" y="676" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">38.889</text>
<text x="48" y="714" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">R17</text>
<text x="150" y="714" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">medium, high, medium → high</text>
<text x="750" y="714" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">2/9</text>
<text x="880" y="714" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">62.5</text>
<text x="1100" y="714" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">13.889</text>
<text x="48" y="752" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">R23</text>
<text x="150" y="752" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">high, medium, medium → high</text>
<text x="750" y="752" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">2/9</text>
<text x="880" y="752" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">62.5</text>
<text x="1100" y="752" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">13.889</text>
<text x="48" y="790" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">R14</text>
<text x="150" y="790" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">medium, medium, medium → moderate</text>
<text x="750" y="790" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">1/9</text>
<text x="880" y="790" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">37.5</text>
<text x="1100" y="790" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="end" style="white-space:pre">4.167</text>
