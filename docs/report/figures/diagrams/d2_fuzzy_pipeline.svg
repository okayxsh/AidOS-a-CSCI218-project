<text x="1190" y="693" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">category: high</text>
<text x="1190" y="727" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5B6B7A" font-weight="400" text-anchor="start" style="white-space:pre">4 of 27 rules fired</text>
<text x="1190" y="761" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5B6B7A" font-weight="400" text-anchor="start" style="white-space:pre">μ: s and t medium 1/3,</text>
<text x="1190" y="795" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5B6B7A" font-weight="400" text-anchor="start" style="white-space:pre">high 2/3; v medium 1</text>
