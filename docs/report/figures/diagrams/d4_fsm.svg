<text x="48" y="884" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">Each accepted action stores <tspan font-family="Consolas, 'Courier New', monospace">version + 1</tspan>.</text>
<text x="48" y="924" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">Any pair not drawn: 409 <tspan font-family="Consolas, 'Courier New', monospace">invalid_transition</tspan>.</text>
<text x="48" y="964" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">Reads are allowed in every state.</text>
<text x="830" y="884" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">Actions: POST <tspan font-family="Consolas, 'Courier New', monospace">…/sessions/{id}/{action}</tspan></text>
<text x="830" y="924" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre"><tspan font-family="Consolas, 'Courier New', monospace">reset</tspan> restores step 0 and clears history.</text>
<text x="830" y="964" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#182B3D" font-weight="400" text-anchor="start" style="white-space:pre">At most 200 events per session.</text>
</svg>
