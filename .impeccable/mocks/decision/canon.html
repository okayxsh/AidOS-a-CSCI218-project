<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#0f1b2d;color:#f8fafc;font-family:Inter,Arial,sans-serif;overflow:hidden}
nav{height:68px;display:flex;align-items:center;gap:28px;padding:0 64px}.cta{margin-left:auto;background:#14b8a6;color:#04201d;padding:11px 18px;border-radius:8px;font-weight:600}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:72px 64px}
h1{font:700 60px/1.05 Inter,sans-serif}p{font-size:19px;color:#cbd5e1;margin-top:20px;line-height:1.5}
.b{display:inline-block;margin-top:28px;background:#14b8a6;color:#04201d;padding:14px 22px;border-radius:8px;font-weight:600}
.shot{background:#f8fafc;border-radius:14px;height:440px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
.k{background:#e2e8f0;height:80px;border-radius:8px}.t{grid-column:1/-1;background:#e2e8f0;height:220px;border-radius:8px}
